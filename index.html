<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/favicons/light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="assets/favicons/dark.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="assets/favicons/dark.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Alejandro Arab — Back online soon</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 560px;
    }

    /* Black cat on the light background — static */
    .cat {
      display: block;
      width: 132px;
      height: 132px;
      image-rendering: pixelated;
      margin-bottom: 40px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      font-weight: 400;
    }

    p {
      margin-top: 24px;
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: 0.04em;
      color: var(--muted);
      max-width: 42ch;
    }

    .links {
      margin-top: 48px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: color 0.25s ease, border-color 0.25s ease;
    }
    .links a:hover { color: var(--amber); border-bottom-color: var(--amber); }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="cat" src="assets/favicons/light.png" alt="" width="132" height="132" />
    <h1>Back online soon</h1>
    <p>The site is getting an update. I'll be right back. Thanks for your patience.</p>
    <nav class="links">
      <a href="mailto:arab.alejandro.v@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/alejandro-arab" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
